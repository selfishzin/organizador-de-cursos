<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" 
          content="connect-src https://www.googleapis.com; 
                   frame-src https://www.youtube.com;">
    
    <script src="config.js"></script> 
    <script src="https://www.youtube.com/iframe_api"></script>

    <title>Meu Cronograma de Vídeos</title>
    
    <style>
        /* ... (CSS :root, [data-theme], etc... sem alteração) ... */
        :root {
            --cor-fundo: #f0f2f5; --cor-container: #ffffff; --cor-texto-principal: #2c3e50; --cor-texto-secundario: #444; --cor-texto-fraco: #777; --cor-borda: #ddd; --cor-header-dia: #f9f9f9; --cor-header-dia-hover: #f1f1f1; --cor-placeholder: #e9e9e9; --cor-placeholder-borda: #ccc; --cor-sombra: rgba(0, 0, 0, 0.05); --cor-botao-principal: #007bff; --cor-botao-principal-hover: #0056b3;
        }
        [data-theme="dark"] {
            --cor-fundo: #121212; --cor-container: #1e1e1e; --cor-texto-principal: #e0e0e0; --cor-texto-secundario: #c5c5c5; --cor-texto-fraco: #888; --cor-borda: #444; --cor-header-dia: #2a2a2a; --cor-header-dia-hover: #333; --cor-placeholder: #333; --cor-placeholder-borda: #555; --cor-sombra: rgba(255, 255, 255, 0.05);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; background-color: var(--cor-fundo); color: var(--cor-texto-principal); padding: 20px; transition: background-color 0.2s, color 0.2s; }
        .container { max-width: 900px; margin: 0 auto; background-color: var(--cor-container); border-radius: 8px; padding: 25px 30px; box-shadow: 0 4px 12px var(--cor-sombra); transition: background-color 0.2s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { text-align: center; color: var(--cor-texto-principal); margin: 0; flex-grow: 1; }
        #theme-toggle { font-size: 1.5rem; background: none; border: none; color: var(--cor-texto-principal); cursor: pointer; padding: 5px; }
        .input-area { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        #playlistUrl { flex-grow: 1; min-width: 300px; padding: 12px; border: 1px solid var(--cor-borda); background-color: var(--cor-fundo); color: var(--cor-texto-principal); border-radius: 6px; font-size: 16px; }
        #carregarPlaylist { padding: 0 20px; font-size: 16px; font-weight: bold; color: #fff; background-color: var(--cor-botao-principal); border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; }
        #carregarPlaylist:hover { background-color: var(--cor-botao-principal-hover); }
        .settings-area { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; }
        .setting-item { display: flex; align-items: center; gap: 8px; }
        .setting-item label { font-size: 0.9em; color: var(--cor-texto-fraco); }
        #esforcoPorDia { width: 70px; padding: 8px; font-size: 1em; border: 1px solid var(--cor-borda); background-color: var(--cor-fundo); color: var(--cor-texto-principal); border-radius: 6px; text-align: center; }
        #resetProgress { font-size: 0.9em; color: var(--cor-botao-principal); background: none; border: none; cursor: pointer; padding: 5px; }
        #resetProgress:hover { text-decoration: underline; }
        .loading-message { text-align: center; font-size: 1.1em; color: var(--cor-texto-fraco); padding: 30px 0; }
        .dia { border: 1px solid var(--cor-borda); border-radius: 8px; margin-bottom: 15px; overflow: hidden; transition: all 0.3s ease; }
        .dia:hover { box-shadow: 0 2px 8px var(--cor-sombra); }
        .dia-destacado { border-color: var(--cor-botao-principal); box-shadow: 0 0 12px rgba(0,123,255,0.5); }
        .dia-header { background-color: var(--cor-header-dia); padding: 15px 20px; cursor: pointer; border-bottom: 1px solid var(--cor-borda); transition: background-color 0.2s; }
        .dia-header:hover { background-color: var(--cor-header-dia-hover); }
        .dia-header h2 { margin: 0; color: var(--cor-texto-principal); font-size: 1.3em; display: flex; align-items: center; justify-content: space-between; }
        .dia-header h2 .frase-esforco { font-size: 0.8em; font-style: italic; color: var(--cor-texto-fraco); margin-left: 10px; }
        .dia-conteudo { display: block; max-height: 0; overflow: hidden; padding-left: 20px; padding-right: 20px; padding-top: 0; padding-bottom: 0; transition: max-height 0.4s ease-out, padding-top 0.4s ease-out, padding-bottom 0.4s ease-out; }
        
        .video-item { margin-bottom: 25px; } /* Aumenta o espaço para o textarea */
        .video-title-wrapper { display: flex; align-items: center; gap: 10px; }
        .video-title-wrapper input[type="checkbox"] { width: 1.3em; height: 1.3em; cursor: pointer; }
        .video-item h3 { margin: 0; font-size: 1.1em; color: var(--cor-texto-secundario); display: flex; align-items: center; gap: 8px; }
        iframe { width: 100%; max-width: 100%; height: auto; aspect-ratio: 16 / 9; border: none; border-radius: 8px; margin-top: 10px; }
        .video-placeholder { width: 100%; aspect-ratio: 16 / 9; background-color: var(--cor-placeholder); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--cor-texto-fraco); font-style: italic; margin-top: 10px; border: 1px dashed var(--cor-placeholder-borda); }
        .completion-emoji { font-size: 0.9em; margin-left: 10px; transform: scale(0); transition: transform 0.2s ease-out; }
        .completion-emoji.completed { transform: scale(1); }
        .esforco-badge { font-size: 0.8em; font-weight: bold; color: var(--cor-botao-principal); background-color: var(--cor-fundo); padding: 2px 8px; border-radius: 10px; border: 1px solid var(--cor-borda); }
        
        /* CSS do Toast */
        #toast-message { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100px); background-color: var(--cor-botao-principal); color: white; padding: 12px 25px; border-radius: 25px; font-size: 1.1em; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); opacity: 0; transition: transform 0.4s ease-out, opacity 0.4s ease-out; z-index: 1000; max-width: 90%; text-align: center; }
        #toast-message.show { transform: translate(-50%, 0); opacity: 1; }
        #toast-message.toast-warning { background-color: #f39c12; color: #000; }

        /* **********************************************
          NOVA PARTE 1: CSS para o Campo de Anotação
          **********************************************
        */
        .anotacao-area {
            margin-top: 10px;
        }
        .anotacao-area label {
            display: block;
            font-size: 0.9em;
            color: var(--cor-texto-fraco);
            margin-bottom: 5px;
        }
        .anotacao-area textarea {
            width: 100%;
            min-height: 60px; /* Altura inicial */
            padding: 10px;
            border: 1px solid var(--cor-borda);
            border-radius: 6px;
            background-color: var(--cor-fundo);
            color: var(--cor-texto-principal);
            font-family: inherit;
            font-size: 1em;
            resize: vertical; /* Permite redimensionar só na vertical */
            transition: border-color 0.2s;
        }
        /* Efeito de piscar quando o campo estiver vazio */
        .anotacao-area textarea:invalid {
            border-color: #e74c3c; /* Vermelho */
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        /* --- Fim da Nova Parte 1 --- */

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Plano de Estudos</h1>
            <button id="theme-toggle" title="Mudar tema">☀️</button>
        </div>
        <div class="input-area">
            <input type="text" id="playlistUrl" placeholder="Cole o link da playlist aqui..." size="50">
            <button id="carregarPlaylist">Carregar</button>
        </div>
        <div class="settings-area">
            <div class="setting-item">
                <label for="esforcoPorDia">Objetivo de Esforço:</label>
                <input type="number" id="esforcoPorDia" value="10" min="1">
            </div>
            <button id="resetProgress" title="Limpar todo o progresso salvo">Limpar Progresso</button>
        </div>
        <div id="videosContainer"></div>
    </div>
    
    <div id="toast-message"></div>


    <script>
        // --- (Referências do DOM, Lógica de Tema, Lógica de Progresso... sem alteração) ---
        const themeToggle = document.getElementById('theme-toggle');
        const playlistUrlInput = document.getElementById('playlistUrl');
        const carregarBtn = document.getElementById('carregarPlaylist');
        const esforcoPorDiaInput = document.getElementById('esforcoPorDia'); 
        const videosContainer = document.getElementById('videosContainer');
        const resetProgressBtn = document.getElementById('resetProgress');
        let currentPlaylistId = null; 
        let videoProgress = {}; // Agora vai guardar: { videoId: "anotacao" } ou { videoId: true } se não anotar

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            themeToggle.textContent = (theme === 'dark') ? '🌙' : '☀️';
            localStorage.setItem('meuTema', theme);
        }
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = (currentTheme === 'light') ? 'dark' : 'light';
            setTheme(newTheme);
        });

        // --- Lógica de Progresso (MODIFICADA para salvar anotação) ---
        function loadProgress(playlistId) {
            const progressData = localStorage.getItem(`progresso_${playlistId}`);
            videoProgress = progressData ? JSON.parse(progressData) : {};
            // console.log("Progresso carregado:", videoProgress); // Para debug
        }
        
        // Agora salva a anotação OU true (se vazio) ou remove se desmarcado
        function saveProgress(playlistId, videoId, isChecked, anotacao = null) {
            if (isChecked) {
                // Salva a anotação (ou true se não houver anotação, embora a validação tente evitar isso)
                videoProgress[videoId] = anotacao || true; 
            } else {
                // Remove a chave do progresso se desmarcado
                delete videoProgress[videoId];
            }
            localStorage.setItem(`progresso_${playlistId}`, JSON.stringify(videoProgress));
            // console.log("Progresso salvo:", videoProgress); // Para debug
        }

        resetProgressBtn.addEventListener('click', () => {
            if (confirm('Tem certeza que deseja limpar todo o progresso desta playlist?')) {
                if (currentPlaylistId) {
                    localStorage.removeItem(`progresso_${currentPlaylistId}`);
                    localStorage.removeItem('logConclusao'); 
                    videoProgress = {};
                    handleLoadPlaylist();
                }
            }
        });

        // --- (Função checkDayCompletion... sem alteração) ---
        function checkDayCompletion(diaConteudoElement) {
            const allCheckboxes = diaConteudoElement.querySelectorAll('input[type="checkbox"]');
            if (allCheckboxes.length === 0) return false;
            const checkedCheckboxes = diaConteudoElement.querySelectorAll('input[type="checkbox"]:checked');
            const diaHeader = diaConteudoElement.previousElementSibling; 
            const emojiSpan = diaHeader.querySelector('.completion-emoji');
            if (allCheckboxes.length === checkedCheckboxes.length) {
                emojiSpan.textContent = '✅';
                emojiSpan.classList.add('completed');
                return true; 
            } else {
                emojiSpan.textContent = '';
                emojiSpan.classList.remove('completed');
                return false;
            }
        }

        // --- (Funções showToast, openDay, closeDay... sem alteração) ---
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast-message');
            toast.textContent = message;
            if (type === 'warning') { toast.classList.add('toast-warning'); } 
            else { toast.classList.remove('toast-warning'); }
            toast.classList.add('show');
            const duration = (type === 'warning') ? 5000 : 2500; 
            setTimeout(() => { toast.classList.remove('show'); }, duration); 
        }
        function openDay(diaConteudo) {
            if (!diaConteudo.dataset.loaded) {
                const placeholders = diaConteudo.querySelectorAll('.video-placeholder');
                placeholders.forEach(placeholder => {
                    const videoId = placeholder.dataset.videoId;
                    new YT.Player(placeholder, {
                        videoId: videoId,
                        playerVars: { 'origin': window.location.origin },
                        events: { 'onStateChange': onPlayerStateChange }
                    });
                });
                diaConteudo.dataset.loaded = 'true';
            }
            diaConteudo.style.paddingTop = '20px';
            diaConteudo.style.paddingBottom = '20px';
            diaConteudo.style.maxHeight = diaConteudo.scrollHeight + "px";
        }
        function closeDay(diaConteudo) {
            diaConteudo.style.paddingTop = '0';
            diaConteudo.style.paddingBottom = '0';
            diaConteudo.style.maxHeight = "0px";
        }
        
        // --- (Funções de Aprendizado: getFraseDeEsforco, logarConclusaoDeDia... sem alteração) ---
        function getFraseDeEsforco(pontos) {
            const frases = CONFIG_APRENDIZADO?.FRASES_DE_ESFORCO || [
                { limite: 10, frase: "Bom dia de estudos!" },
                { limite: 99, frase: "Dia de muito esforço!" }
            ];
            for (const item of frases) { if (pontos <= item.limite) { return item.frase; } }
            return frases[frases.length - 1].frase;
        }
        function logarConclusaoDeDia() {
            const hoje = new Date().toDateString(); 
            let logConclusao = JSON.parse(localStorage.getItem('logConclusao')) || {};
            if (logConclusao.data !== hoje) { logConclusao = { data: hoje, count: 0 }; }
            logConclusao.count++;
            localStorage.setItem('logConclusao', JSON.stringify(logConclusao));
            return logConclusao.count;
        }

        // --- (Função autoOpenAndHighlightNextDay... sem alteração) ---
        function autoOpenAndHighlightNextDay() {
            document.querySelectorAll('.dia-destacado').forEach(el => el.classList.remove('dia-destacado'));
            const todosOsDias = document.querySelectorAll('.dia');
            for (const diaElement of todosOsDias) {
                const diaHeader = diaElement.querySelector('.dia-header');
                const diaConteudo = diaElement.querySelector('.dia-conteudo');
                const emojiSpan = diaHeader.querySelector('.completion-emoji');
                if (!emojiSpan || !emojiSpan.classList.contains('completed')) {
                    diaElement.classList.add('dia-destacado');
                    openDay(diaConteudo); 
                    setTimeout(() => { diaHeader.scrollIntoView({ block: 'center' }); }, 450);
                    break;
                }
            }
        }

        // --- (Lógica de Carregamento da Página... sem alteração) ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('meuTema') || 'light';
            setTheme(savedTheme);
            const savedEsforco = localStorage.getItem('meuEsforcoPorDia') || CONFIG_ESFORCO.ORCAMENTO_DIARIO_PADRAO;
            esforcoPorDiaInput.value = savedEsforco;
            let urlParaCarregar = null;
            const urlSalva = localStorage.getItem('minhaPlaylistSalva');
            const urlPadrao = (typeof PLAYLIST_PADRAO_URL !== 'undefined') ? PLAYLIST_PADRAO_URL : null;
            if (urlSalva) { urlParaCarregar = urlSalva; } 
            else if (urlPadrao) { urlParaCarregar = urlPadrao; }
            if (urlParaCarregar) {
                playlistUrlInput.value = urlParaCarregar;
                handleLoadPlaylist();
            }
        });
        
        // --- (Lógica handleLoadPlaylist... sem alteração) ---
        carregarBtn.addEventListener('click', handleLoadPlaylist);
        async function handleLoadPlaylist() {
            const playlistUrl = playlistUrlInput.value;
            if (!playlistUrl) return;
            localStorage.setItem('minhaPlaylistSalva', playlistUrl);
            localStorage.setItem('meuEsforcoPorDia', esforcoPorDiaInput.value); 
            const playlistIdMatch = playlistUrl.match(/[?&]list=([^&]+)/);
            if (!playlistIdMatch) { alert('URL da playlist inválida!'); return; }
            currentPlaylistId = playlistIdMatch[1];
            carregarVideosDaPlaylist(currentPlaylistId);
        }

        // --- (Funções de Cálculo de Esforço... sem alteração) ---
        function parseDuration(durationString) {
            const regex = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/;
            const matches = durationString.match(regex);
            const hours = parseInt(matches[1] || 0);
            const minutes = parseInt(matches[2] || 0);
            const seconds = parseInt(matches[3] || 0);
            return (hours * 60) + minutes + (seconds / 60);
        }
        function calcularEsforco(title, durationString) {
            const { PONTOS_POR_MINUTO, PONTUACAO_MINIMA, MODIFICADORES_TITULO } = CONFIG_ESFORCO;
            const totalMinutes = parseDuration(durationString);
            let score = totalMinutes * PONTOS_POR_MINUTO;
            const lowerTitle = title.toLowerCase();
            for (const word of MODIFICADORES_TITULO.FACIL.palavras) { if (lowerTitle.includes(word)) { score += MODIFICADORES_TITULO.FACIL.modificador; break; } }
            for (const word of MODIFICADORES_TITULO.DIFICIL.palavras) { if (lowerTitle.includes(word)) { score += MODIFICADORES_TITULO.DIFICIL.modificador; break; } }
            return Math.max(PONTUACAO_MINIMA, Math.round(score));
        }


        // --- Função Principal (COM HTML DE ANOTAÇÃO) ---
        async function carregarVideosDaPlaylist(playlistId) {
            // ... (ETAPA 1, 2, 3: Chamadas de API, Cálculo de Esforço... sem alteração) ...
            if (typeof CHAVE_API === 'undefined' || CHAVE_API === 'SUA_CHAVE_DE_API_AQUI') { alert('ERRO: CHAVE_API não encontrada! Verifique seu arquivo config.js'); return; }
            const API_KEY = CHAVE_API;
            videosContainer.innerHTML = '<p class="loading-message">Carregando lista de vídeos...</p>'; 
            loadProgress(playlistId); // Carrega anotações salvas
            let videosInfo = []; 
            let videoIds = [];
            let nextPageToken = '';
            try {
                do {
                    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}&pageToken=${nextPageToken}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.error) throw new Error('Erro da API (Playlist): '.data.error.message);
                    data.items.forEach(item => {
                        const title = item.snippet.title;
                        const videoId = item.snippet.resourceId.videoId;
                        if (title !== "Private video" && title !== "Deleted video") { videosInfo.push({ videoId, title }); videoIds.push(videoId); }
                    });
                    nextPageToken = data.nextPageToken || '';
                } while (nextPageToken);

                videosContainer.innerHTML = '<p class="loading-message">Calculando esforço (buscando durações)...</p>'; 

                let allVideosCompletos = [];
                const durationMap = {};
                for (let i = 0; i < videoIds.length; i += 50) {
                    const batchIds = videoIds.slice(i, i + 50).join(',');
                    const url = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${batchIds}&key=${API_KEY}`;
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.error) throw new Error('Erro da API (Duração): '.data.error.message);
                    data.items.forEach(item => { durationMap[item.id] = item.contentDetails.duration; });
                }
                
                allVideosCompletos = videosInfo.map(video => {
                    const duration = durationMap[video.videoId] || 'PT0S';
                    const esforco = calcularEsforco(video.title, duration);
                    // Pega a anotação salva (se existir)
                    const anotacaoSalva = (videoProgress[video.videoId] && typeof videoProgress[video.videoId] === 'string') ? videoProgress[video.videoId] : "";
                    return { ...video, duration, esforco, anotacaoSalva };
                });

                videosContainer.innerHTML = ''; 
                if (allVideosCompletos.length === 0) { videosContainer.innerHTML = '<p class="loading-message">Nenhum vídeo encontrado nesta playlist.</p>'; return; }
                
                // --- (ETAPA 4: Montar os Dias... com HTML de ANOTAÇÃO) ---
                const orcamentoDiario = parseInt(esforcoPorDiaInput.value) || CONFIG_ESFORCO.ORCAMENTO_DIARIO_PADRAO;
                let diaAtual = 1;
                let esforcoNoDia = 0;
                let diaDiv, diaHeader, diaConteudo;

                allVideosCompletos.forEach((video) => {
                    const { videoId, title, esforco, duration, anotacaoSalva } = video;
                    
                    // Verifica se está marcado pelo localStorage (pode ser true ou uma string de anotação)
                    const isChecked = videoProgress[videoId] !== undefined; 
                    
                    if (!diaConteudo || (esforcoNoDia >= orcamentoDiario)) {
                        diaAtual++;
                        esforcoNoDia = 0; 
                        diaDiv = document.createElement('div');
                        diaDiv.className = 'dia';
                        diaHeader = document.createElement('div');
                        diaHeader.className = 'dia-header';
                        diaHeader.innerHTML = `<h2><span>Dia ${diaAtual-1}</span><span class="frase-esforco"></span><span class="completion-emoji"></span></h2>`;
                        diaDiv.appendChild(diaHeader);
                        diaConteudo = document.createElement('div');
                        diaConteudo.className = 'dia-conteudo';
                        diaDiv.appendChild(diaConteudo);
                        videosContainer.appendChild(diaDiv);
                    }
                    esforcoNoDia += esforco;

                    /* **********************************************
                      NOVA PARTE 2: HTML do Vídeo com Textarea
                      **********************************************
                    */
                    diaConteudo.innerHTML += `
                        <div class="video-item">
                            <div class="video-title-wrapper">
                                <input type="checkbox" data-video-id="${videoId}" ${isChecked ? 'checked' : ''}>
                                <h3>
                                    ${title}
                                    <span class="esforco-badge" title="${parseDuration(duration).toFixed(0)} min">🔥 ${esforco} pts</span>
                                </h3>
                            </div>
                            <div id="player-${videoId}" class="video-placeholder" data-video-id="${videoId}">
                                <p>Vídeo pronto para carregar...</p>
                            </div>
                            <div class="anotacao-area">
                                <label for="anotacao-${videoId}">O que você aprendeu? (1 frase)</label>
                                <textarea id="anotacao-${videoId}" data-video-id="${videoId}" rows="2" placeholder="Escreva aqui para marcar como concluído...">${anotacaoSalva}</textarea> 
                            </div>
                        </div>
                    `;
                    // --- Fim da Nova Parte 2 ---
                });
                
                // --- (ETAPA 5: Adicionar frases... sem alteração) ---
                document.querySelectorAll('.dia').forEach(diaEl => {
                    let totalEsforco = 0;
                    diaEl.querySelectorAll('.esforco-badge').forEach(badge => { totalEsforco += parseInt(badge.textContent.match(/(\d+)/)[0]); });
                    const frase = getFraseDeEsforco(totalEsforco);
                    const fraseSpan = diaEl.querySelector('.dia-header h2 .frase-esforco');
                    if(fraseSpan) { fraseSpan.textContent = frase; }
                });

            } catch (error) {
                console.error(error);
                videosContainer.innerHTML = `<p style="color: red; text-align: center;"><b>Erro ao carregar a playlist.</b> Verifique sua chave de API ou se a playlist é pública.</p>`;
                return;
            }

            // --- ETAPA 6: Adicionar Lógica de Eventos ---
            document.querySelectorAll('.dia-conteudo').forEach(checkDayCompletion);
            autoOpenAndHighlightNextDay();
            
            // --- (Lógica de clique no DIA... sem alteração) ---
            document.querySelectorAll('.dia-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    e.currentTarget.closest('.dia').classList.remove('dia-destacado');
                    const conteudo = header.nextElementSibling; 
                    if (conteudo.style.maxHeight && conteudo.style.maxHeight !== "0px") { closeDay(conteudo); } 
                    else { openDay(conteudo); }
                });
            });

            /* **********************************************
              NOVA PARTE 3: Lógica do Checkbox (O "Porteiro")
              **********************************************
            */
            document.querySelectorAll('.video-title-wrapper input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const videoId = e.target.dataset.videoId;
                    const isChecked = e.target.checked;
                    
                    // Encontra o textarea correspondente
                    const textarea = document.getElementById(`anotacao-${videoId}`);
                    const anotacao = textarea ? textarea.value.trim() : ""; // Pega o texto e remove espaços extras

                    // --- O "PORTEIRO" ---
                    // Se o usuário está TENTANDO MARCAR (isChecked é true)
                    // E a anotação está VAZIA
                    if (isChecked && anotacao === "") {
                        // 1. Impedir a marcação
                        e.preventDefault(); // Cancela o evento de marcar
                        checkbox.checked = false; // Desfaz a marcação visual
                        
                        // 2. Avisar e focar
                        showToast("Escreva o que aprendeu antes de marcar!", "warning");
                        textarea.focus(); // Coloca o cursor no textarea
                        textarea.setAttribute('required', 'true'); // Ativa o estilo :invalid do CSS (vermelho + shake)
                        // Remove o 'required' depois da animação para não ficar vermelho sempre
                        setTimeout(() => textarea.removeAttribute('required'), 500); 
                        return; // Para a execução aqui
                    }

                    // Se passou pelo porteiro (ou está desmarcando)
                    saveProgress(currentPlaylistId, videoId, isChecked, anotacao); // Salva (com a anotação se houver)
                    
                    // Continua a lógica de verificação do dia e transição (como antes)
                    const diaConteudo = e.target.closest('.dia-conteudo');
                    if (diaConteudo) {
                        const isDayNowCompleted = checkDayCompletion(diaConteudo);
                        if (isDayNowCompleted && isChecked) { // Só avança se o dia foi COMPLETO AGORA
                            const diasCompletosHoje = logarConclusaoDeDia();
                            const limiteAviso = CONFIG_APRENDIZADO?.LIMITE_DIAS_CONCLUIDOS || 2;
                            let mensagem = "Dia Concluído! Bom trabalho!";
                            let tipoToast = 'info';
                            if (diasCompletosHoje >= limiteAviso) {
                                mensagem = CONFIG_APRENDIZADO.MENSAGEM_AVISO.replace('{count}', diasCompletosHoje);
                                tipoToast = 'warning';
                            }
                            showToast(mensagem, tipoToast);
                            setTimeout(() => {
                                closeDay(diaConteudo);
                                const diaAtualElement = diaConteudo.closest('.dia');
                                const proximoDiaElement = diaAtualElement.nextElementSibling;
                                if (proximoDiaElement && proximoDiaElement.classList.contains('dia')) {
                                    const proximoHeader = proximoDiaElement.querySelector('.dia-header');
                                    const proximoConteudo = proximoDiaElement.querySelector('.dia-conteudo');
                                    document.querySelectorAll('.dia-destacado').forEach(el => el.classList.remove('dia-destacado'));
                                    proximoDiaElement.classList.add('dia-destacado');
                                    openDay(proximoConteudo);
                                    setTimeout(() => { proximoHeader.scrollIntoView({ block: 'center' }); }, 450); 
                                }
                            }, 2000);
                        }
                    }
                });
            });

            // NOVO: Salvar anotação automaticamente quando o usuário parar de digitar
            document.querySelectorAll('.anotacao-area textarea').forEach(textarea => {
                let timeoutId = null;
                textarea.addEventListener('input', (e) => {
                    // Cancela o timer anterior se o usuário ainda estiver digitando
                    clearTimeout(timeoutId);
                    
                    // Define um novo timer para salvar depois de 1.5 segundos de inatividade
                    timeoutId = setTimeout(() => {
                        const videoId = e.target.dataset.videoId;
                        const anotacao = e.target.value.trim();
                        // Só salva se o vídeo JÁ ESTIVER MARCADO (evita salvar antes da hora)
                        const checkbox = document.querySelector(`input[data-video-id="${videoId}"]`);
                        if (checkbox && checkbox.checked) {
                            saveProgress(currentPlaylistId, videoId, true, anotacao);
                        }
                    }, 1500); // 1.5 segundos
                });
            });


        }
        
        // --- Função onPlayerStateChange (MODIFICADA) ---
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                const videoId = event.target.getVideoData().video_id;
                const checkbox = document.querySelector(`input[data-video-id="${videoId}"]`);
                const textarea = document.getElementById(`anotacao-${videoId}`);
                
                // Se o vídeo terminou e NÃO está marcado
                if (checkbox && !checkbox.checked) {
                    // Foca no textarea para incentivar a anotação
                    textarea.focus();
                    showToast("Ótimo! Agora escreva o que aprendeu para concluir.", "info");
                    
                    // Tenta marcar o checkbox (o "porteiro" vai validar)
                    checkbox.checked = true;
                    checkbox.dispatchEvent(new Event('change')); 
                }
            }
        }
    </script>

</body>
</html>
